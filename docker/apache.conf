ServerTokens Prod
ServerSignature Off
AddDefaultCharset ISO-8859-1

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php index.htm index.html
    # El servidor original no distinguia mayusculas en algunas rutas (TopV2.jpg, Programas/...)
    CheckSpelling On
    CheckCaseOnly On
</Directory>

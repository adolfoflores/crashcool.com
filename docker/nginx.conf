# Sustituye al server por defecto de shinsenter/php, que manda a /index.php todo lo que
# no existe: aqui una ruta inexistente es un 404, como en el servidor original
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.htm index.html;
    charset iso-8859-1;
    # /foro -> /foro/ con Location relativo: detras de Traefik no conoce el esquema ni el puerto
    absolute_redirect off;

    access_log /proc/1/fd/2 custom;
    error_log /proc/1/fd/2 error;

    include /etc/nginx/custom.d/00-ext-gzip.conf;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reto del torneo: sin extension conocida, que se vea como texto y no se descargue
    location ~ \.passw$ {
        default_type text/plain;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass @php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
